name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Typecheck
        run: npx -y typescript@5.9 tsc --noEmit
      - name: Tests (offline, mocked fetch)
        run: node --test tests/*.test.ts
      - name: Tarball sanity (files allowlist)
        run: npm pack --dry-run
