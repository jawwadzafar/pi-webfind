name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (dev types for typecheck)
        run: npm ci
      - name: Typecheck
        # npm exec --package (not `npx pkg cmd`): typescript's manifest has two bins
        # (tsc, tsserver) and npx's auto-bin-pick can't disambiguate — "could not
        # determine executable to run" on every npm we tested. --package + -- names
        # the command explicitly and works on npm 10 and 11 alike.
        run: npm exec --yes --package typescript@5.9.3 -- tsc --noEmit
      - name: Tests (offline, mocked fetch)
        run: node --test tests/*.test.ts
      - name: Tarball sanity (files allowlist)
        run: npm pack --dry-run
