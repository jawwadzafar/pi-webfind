name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish in dry-run mode"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: npm >= 11.5.1 (required for OIDC trusted publishing)
        run: npm install -g npm@latest
      - run: npm ci
      - name: Sanity — tarball must be clean
        run: |
          npm pack --dry-run
          COUNT=$(npm pack --dry-run 2>&1 | grep -oE "total files: [0-9]+" | grep -oE "[0-9]+")
          if [ "$COUNT" -gt 20 ]; then echo "tarball has $COUNT files — files allowlist broken?"; exit 1; fi
      - name: Publish to npm (OIDC trusted publishing — no token, no OTP)
        if: ${{ inputs.dry_run != true }}
        run: npm publish --provenance
      - name: GitHub Release with tarball
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          TARBALL="pi-webfind-${TAG#v}.tgz"
          npm pack
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "pi-webfind ${TAG}" \
            --generate-notes \
            "$TARBALL" \
          || gh release upload "$TAG" "$TARBALL" --clobber
